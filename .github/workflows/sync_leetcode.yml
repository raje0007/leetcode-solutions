name: Sync Leetcode
on:
  workflow_dispatch: # Allows you to trigger it manually anytime
  schedule:
    - cron: "0 8 * * 6" # Automatically runs every Saturday at 8 AM GMT

permissions:
  contents: write # Grants write permissions directly via code

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sync
        uses: joshcai/leetcode-sync@v1.5
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
